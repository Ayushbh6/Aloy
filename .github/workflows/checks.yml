name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -c "import aloy"
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swiftc mac/InteractionState.swift mac/tests/main.swift -o "$RUNNER_TEMP/aloy-check" && "$RUNNER_TEMP/aloy-check"
      - run: swiftc -swift-version 5 mac/Aloy.swift mac/InteractionState.swift -framework AppKit -framework AVFoundation -o "$RUNNER_TEMP/Aloy"

name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg ripgrep
      - run: python -m pytest -q
      - run: python -m aloy.harness_smoke --mode fake --scenario pdf
      - run: python -m aloy.harness_smoke --mode fake --scenario video
      - run: python -c "import aloy"
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Native interaction and model checks
        shell: bash
        run: |
          sources=(mac/VoiceAudio.swift mac/InteractionState.swift mac/OrbView.swift mac/Playground.swift mac/Canvas.swift mac/CompanionBubble.swift mac/ComputerActionApproval.swift mac/ScreenCapture.swift)
          frameworks=(-framework AppKit -framework ApplicationServices -framework CoreGraphics -framework AVFoundation -framework ScreenCaptureKit -framework SwiftUI)
          swiftc -swift-version 5 "${sources[@]}" mac/tests/main.swift "${frameworks[@]}" -o "$RUNNER_TEMP/aloy-check"
          "$RUNNER_TEMP/aloy-check"
          swiftc -swift-version 5 -parse-as-library "${sources[@]}" mac/tests/playground/main.swift "${frameworks[@]}" -o "$RUNNER_TEMP/playground-check"
          "$RUNNER_TEMP/playground-check"
          swiftc -swift-version 5 mac/Aloy.swift "${sources[@]}" "${frameworks[@]}" -o "$RUNNER_TEMP/Aloy"

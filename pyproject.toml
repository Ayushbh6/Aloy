[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aloy-assistant"
version = "0.0.1"
description = "A modular personal desktop companion and visual voice tutor."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/aloy"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
